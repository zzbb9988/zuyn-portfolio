<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="0.45" stop-color="#EFE6FF"/>
      <stop offset="1" stop-color="#F6E5FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="18%" r="60%">
      <stop offset="0" stop-color="rgba(186,214,255,0.85)"/>
      <stop offset="1" stop-color="rgba(186,214,255,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="26%" r="60%">
      <stop offset="0" stop-color="rgba(219,198,255,0.8)"/>
      <stop offset="1" stop-color="rgba(219,198,255,0)"/>
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="92%" r="65%">
      <stop offset="0" stop-color="rgba(255,205,244,0.65)"/>
      <stop offset="1" stop-color="rgba(255,205,244,0)"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B08BFF"/>
      <stop offset="0.35" stop-color="#7A53FF"/>
      <stop offset="1" stop-color="#B06BFF"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="rgba(91,72,190,0.25)"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="rgba(91,72,190,0.18)"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#glow3)"/>

  <text x="80" y="120" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="38" fill="rgba(98,71,194,0.7)" letter-spacing="0.06em">
    FINAL
  </text>
  <text x="80" y="170" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="38" fill="rgba(98,71,194,0.7)" letter-spacing="0.06em">
    PORTFOLIO
  </text>

  <text x="980" y="95" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="20" fill="rgba(98,71,194,0.65)" letter-spacing="0.08em">
    ✦ CARMEN, JESSICA, OLIVIA, VINCENT, ZUYN ✦
  </text>

  <!-- sparkles -->
  <g opacity="0.95" filter="url(#soft)">
    <rect x="900" y="145" width="18" height="18" rx="3" fill="rgba(255,255,255,0.9)" transform="rotate(45 909 154)"/>
    <rect x="1070" y="120" width="14" height="14" rx="3" fill="rgba(255,255,255,0.85)" transform="rotate(45 1077 127)"/>
    <rect x="1210" y="185" width="16" height="16" rx="3" fill="rgba(255,255,255,0.85)" transform="rotate(45 1218 193)"/>
  </g>

  <!-- phone mock -->
  <g filter="url(#shadow)">
    <rect x="170" y="210" width="340" height="560" rx="54" fill="rgba(255,255,255,0.55)" stroke="rgba(140,109,255,0.25)" stroke-width="2"/>
    <rect x="190" y="240" width="300" height="500" rx="40" fill="rgba(255,255,255,0.7)"/>
    <rect x="300" y="232" width="80" height="18" rx="9" fill="rgba(26,26,26,0.08)"/>

    <!-- app cards -->
    <g>
      <rect x="215" y="285" width="250" height="92" rx="22" fill="rgba(140,109,255,0.14)" stroke="rgba(140,109,255,0.22)"/>
      <rect x="215" y="395" width="250" height="92" rx="22" fill="rgba(255,205,244,0.18)" stroke="rgba(140,109,255,0.18)"/>
      <rect x="215" y="505" width="250" height="92" rx="22" fill="rgba(186,214,255,0.2)" stroke="rgba(140,109,255,0.18)"/>
      <circle cx="250" cy="332" r="18" fill="rgba(255,255,255,0.85)" stroke="rgba(140,109,255,0.25)"/>
      <circle cx="250" cy="442" r="18" fill="rgba(255,255,255,0.85)" stroke="rgba(140,109,255,0.25)"/>
      <circle cx="250" cy="552" r="18" fill="rgba(255,255,255,0.85)" stroke="rgba(140,109,255,0.25)"/>
      <rect x="280" y="316" width="160" height="14" rx="7" fill="rgba(98,71,194,0.35)"/>
      <rect x="280" y="340" width="120" height="12" rx="6" fill="rgba(26,26,26,0.12)"/>
      <rect x="280" y="426" width="170" height="14" rx="7" fill="rgba(98,71,194,0.35)"/>
      <rect x="280" y="450" width="130" height="12" rx="6" fill="rgba(26,26,26,0.12)"/>
      <rect x="280" y="536" width="150" height="14" rx="7" fill="rgba(98,71,194,0.35)"/>
      <rect x="280" y="560" width="140" height="12" rx="6" fill="rgba(26,26,26,0.12)"/>
    </g>
  </g>

  <!-- floating cards -->
  <g filter="url(#soft)">
    <g transform="translate(560 220) rotate(-6)">
      <rect x="0" y="0" width="230" height="160" rx="28" fill="rgba(255,255,255,0.55)" stroke="rgba(140,109,255,0.2)"/>
      <rect x="18" y="22" width="194" height="18" rx="9" fill="rgba(98,71,194,0.25)"/>
      <rect x="18" y="52" width="150" height="14" rx="7" fill="rgba(26,26,26,0.12)"/>
      <rect x="18" y="78" width="176" height="14" rx="7" fill="rgba(26,26,26,0.12)"/>
      <rect x="18" y="108" width="88" height="34" rx="17" fill="rgba(140,109,255,0.16)" stroke="rgba(140,109,255,0.2)"/>
    </g>
    <g transform="translate(650 420) rotate(8)">
      <rect x="0" y="0" width="240" height="170" rx="28" fill="rgba(255,255,255,0.55)" stroke="rgba(140,109,255,0.2)"/>
      <rect x="18" y="22" width="170" height="18" rx="9" fill="rgba(98,71,194,0.25)"/>
      <rect x="18" y="52" width="190" height="14" rx="7" fill="rgba(26,26,26,0.12)"/>
      <rect x="18" y="78" width="160" height="14" rx="7" fill="rgba(26,26,26,0.12)"/>
      <rect x="18" y="108" width="120" height="14" rx="7" fill="rgba(26,26,26,0.12)"/>
    </g>
  </g>

  <!-- title block -->
  <g>
    <text x="880" y="300" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="110" font-weight="700" fill="url(#title)" letter-spacing="0.02em" filter="url(#soft)">
      SETTLE
    </text>
    <text x="880" y="400" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="110" font-weight="700" fill="url(#title)" letter-spacing="0.02em" filter="url(#soft)">
      SYNC
    </text>
    <text x="980" y="460" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="22" font-weight="800" fill="rgba(98,71,194,0.75)" letter-spacing="0.08em">
      TRANSITIONING INTO THE
    </text>
    <text x="1015" y="495" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="22" font-weight="800" fill="rgba(98,71,194,0.75)" letter-spacing="0.08em">
      NEW COMMUNITY
    </text>
  </g>

  <!-- tiny isometric-ish icons -->
  <g filter="url(#soft)" opacity="0.95">
    <g transform="translate(915 560)">
      <rect x="0" y="30" width="70" height="18" rx="8" fill="rgba(98,71,194,0.2)"/>
      <rect x="10" y="0" width="50" height="40" rx="12" fill="rgba(255,255,255,0.55)" stroke="rgba(140,109,255,0.22)"/>
      <rect x="22" y="10" width="26" height="18" rx="9" fill="rgba(140,109,255,0.22)"/>
    </g>
    <g transform="translate(1010 580)">
      <rect x="0" y="30" width="70" height="18" rx="8" fill="rgba(98,71,194,0.2)"/>
      <rect x="10" y="4" width="50" height="36" rx="10" fill="rgba(255,255,255,0.55)" stroke="rgba(140,109,255,0.22)"/>
      <rect x="18" y="12" width="34" height="14" rx="7" fill="rgba(255,205,244,0.3)"/>
    </g>
    <g transform="translate(1100 550)">
      <rect x="0" y="30" width="70" height="18" rx="8" fill="rgba(98,71,194,0.2)"/>
      <rect x="12" y="4" width="46" height="36" rx="10" fill="rgba(255,255,255,0.55)" stroke="rgba(140,109,255,0.22)"/>
      <circle cx="35" cy="22" r="10" fill="rgba(186,214,255,0.35)"/>
    </g>
  </g>
</svg>
