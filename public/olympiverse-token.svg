<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f7ff"/>
    </linearGradient>
    <radialGradient id="lime" cx="22%" cy="18%" r="55%">
      <stop offset="0" stop-color="rgba(204,255,0,0.55)"/>
      <stop offset="1" stop-color="rgba(204,255,0,0)"/>
    </radialGradient>
    <radialGradient id="lav" cx="78%" cy="18%" r="55%">
      <stop offset="0" stop-color="rgba(184,156,255,0.55)"/>
      <stop offset="1" stop-color="rgba(184,156,255,0)"/>
    </radialGradient>
    <radialGradient id="blue" cx="70%" cy="78%" r="60%">
      <stop offset="0" stop-color="rgba(0,180,255,0.35)"/>
      <stop offset="1" stop-color="rgba(0,180,255,0)"/>
