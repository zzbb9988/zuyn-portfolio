      <text x="18" y="27" font-size="13" font-weight="900" fill="rgba(4,30,66,0.86)">UX Consulting</text>
    </g>
    <g transform="translate(160 0)">
      <rect x="0" y="0" width="132" height="42" rx="21" fill="rgba(4,30,66,0.08)" stroke="rgba(4,30,66,0.18)"/>
      <text x="18" y="27" font-size="13" font-weight="900" fill="rgba(4,30,66,0.86)">User Research</text>
    </g>
    <g transform="translate(306 0)">
      <rect x="0" y="0" width="128" height="42" rx="21" fill="rgba(4,30,66,0.08)" stroke="rgba(4,30,66,0.18)"/>
      <text x="18" y="27" font-size="13" font-weight="900" fill="rgba(4,30,66,0.86)">Product Design</text>
    </g>
    <g transform="translate(448 0)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="rgba(228,0,43,0.10)" stroke="rgba(228,0,43,0.28)"/>
      <text x="18" y="27" font-size="13" font-weight="900" fill="rgba(228,0,43,0.92)">Higher Education</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="310" width="420" height="330" rx="22" fill="#ffffff" stroke="rgba(4,30,66,0.12)"/>
    <rect x="1010" y="350" width="340" height="14" rx="7" fill="rgba(4,30,66,0.22)"/>
    <rect x="1010" y="380" width="300" height="12" rx="6" fill="rgba(51,51,51,0.14)"/>
    <rect x="1010" y="404" width="340" height="12" rx="6" fill="rgba(51,51,51,0.12)"/>
    <rect x="1010" y="428" width="290" height="12" rx="6" fill="rgba(51,51,51,0.12)"/>
    <rect x="1010" y="452" width="320" height="12" rx="6" fill="rgba(51,51,51,0.12)"/>
    <rect x="1010" y="476" width="280" height="12" rx="6" fill="rgba(51,51,51,0.12)"/>
    <rect x="1010" y="500" width="350" height="12" rx="6" fill="rgba(51,51,51,0.12)"/>

    <rect x="1010" y="536" width="190" height="46" rx="23" fill="#041E42"/>
    <text x="1042" y="566" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="14" font-weight="900" fill="rgba(255,255,255,0.95)">
