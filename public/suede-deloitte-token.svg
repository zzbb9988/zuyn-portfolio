<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F5F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#041E42"/>
      <stop offset="1" stop-color="#0B2C5A"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="120" width="1360" height="660" rx="32" fill="#ffffff" stroke="rgba(4,30,66,0.10)"/>
    <rect x="120" y="120" width="1360" height="88" rx="32" fill="url(#navy)"/>
    <rect x="120" y="188" width="1360" height="20" fill="url(#navy)"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" fill="#041E42">
    <text x="180" y="310" font-size="72" font-weight="900" letter-spacing="-0.03em">
      SUEDE x Deloitte
    </text>
    <text x="184" y="360" font-size="26" font-weight="800" fill="rgba(4,30,66,0.78)">
      Redesigning Unit of Study Selection
    </text>

    <text x="184" y="420" font-size="18" font-weight="500" fill="rgba(51,51,51,0.82)">
      <tspan x="184" dy="0">A human-centered redesign of the University of Sydney's course enrollment system to help students</tspan>
      <tspan x="184" dy="28">plan their degrees with confidence and clarity.</tspan>
    </text>
  </g>

  <g transform="translate(184 480)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter">
