    </text>
    <rect x="1210" y="536" width="160" height="46" rx="23" fill="#E4002B"/>
    <text x="1242" y="566" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter" font-size="14" font-weight="900" fill="rgba(255,255,255,0.95)">
